name: Matrix Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy ${{ matrix.deployment.environment }} - ${{ matrix.deployment.region }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        deployment:
          - environment: development
            region: ap-south-1
            replicas: 1

          - environment: staging
            region: ap-south-1
            replicas: 2

          - environment: production
            region: ap-south-1
            replicas: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show deployment configuration
        run: |
          echo "Environment: ${{ matrix.deployment.environment }}"
          echo "Region: ${{ matrix.deployment.region }}"
          echo "Replicas: ${{ matrix.deployment.replicas }}"

      - name: Deploy
        run: |
          echo "Deploying to ${{ matrix.deployment.environment }}"
          echo "Region: ${{ matrix.deployment.region }}"
          echo "Replicas: ${{ matrix.deployment.replicas }}"
